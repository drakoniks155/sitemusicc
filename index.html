<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#313338">
<title>Nixify</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-main: #313338;
  --bg-dark: #2b2d31;
  --bg-darker: #1e1f22;
  --bg-hover: #3a3c42;
  --blurple: #5865F2;
  --blurple-hover: #4752c4;
  --text: #f2f3f5;
  --text-muted: #b5bac1;

  --dyn-1: #5865F2;
  --dyn-2: #b44bf2;
  --dyn-3: #1e1f22;
}

html, body { height: 100%; }

body {
  font-family: "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #1e1f22;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ==== Animated dynamic background ==== */
.bg-anim {
  position: fixed;
  inset: -20%;
  z-index: -2;
  background:
    radial-gradient(circle at 20% 30%, var(--dyn-1) 0%, transparent 45%),
    radial-gradient(circle at 80% 20%, var(--dyn-2) 0%, transparent 50%),
    radial-gradient(circle at 50% 90%, var(--dyn-3) 0%, transparent 55%),
    #1e1f22;
  filter: blur(70px) saturate(1.4);
  opacity: 0.85;
  transition: background 1.4s ease;
  animation: bgFloat 20s ease-in-out infinite alternate;
}
.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(ellipse at center, rgba(30,31,34,0.55) 0%, rgba(30,31,34,0.94) 75%);
  pointer-events: none;
}
@keyframes bgFloat {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(3%, -2%) scale(1.05); }
  100% { transform: translate(-3%, 2%) scale(1.02); }
}

/* ==== Header ==== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: rgba(43, 45, 49, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
  z-index: 20;
  animation: slideDown 0.5s ease;
}
@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.3px;
  background: linear-gradient(135deg, #fff, #b5bac1);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.upload-btn {
  background: var(--blurple);
  color: #fff;
  padding: 10px 20px;
  border-radius: 24px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4);
}
.upload-btn:hover {
  background: var(--blurple-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(88, 101, 242, 0.55);
}
.upload-btn:active { transform: scale(0.95); }

/* ==== Main ==== */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  overflow: hidden;
}

.player-card {
  width: 100%;
  max-width: 420px;
  background: rgba(49, 51, 56, 0.75);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 28px;
  padding: 28px 24px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes cardIn {
  from { transform: translateY(30px) scale(0.95); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

.cover-wrap {
  width: 220px;
  height: 220px;
  border-radius: 20px;
  overflow: hidden;
  background: var(--bg-darker);
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
  position: relative;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cover-wrap.playing {
  animation: coverPulse 3s ease-in-out infinite;
}
@keyframes coverPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 10px 40px rgba(0,0,0,0.55); }
  50%      { transform: scale(1.02); box-shadow: 0 15px 50px rgba(88,101,242,0.4); }
}
.cover-wrap::before {
  content: "🎵";
  font-size: 64px;
  opacity: 0.3;
  position: absolute;
}
.cover-wrap.has-cover::before { display: none; }

#cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  position: relative;
  z-index: 1;
  transition: opacity 0.4s ease;
}

.track-info {
  text-align: center;
  width: 100%;
  min-height: 44px;
}
.title {
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.3s;
}
.artist {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ==== Equalizer (Yandex style) ==== */
.equalizer {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  height: 28px;
  width: 100%;
  margin-top: -4px;
}
.equalizer .bar {
  width: 4px;
  border-radius: 2px;
  background: linear-gradient(to top, var(--blurple), #a48cf7);
  height: 20%;
  transition: height 0.12s ease;
  opacity: 0.4;
}
.equalizer.playing .bar {
  opacity: 1;
  animation: eq 1.1s ease-in-out infinite;
}
.equalizer.playing .bar:nth-child(1)  { animation-delay: 0.00s; animation-duration: 0.9s; }
.equalizer.playing .bar:nth-child(2)  { animation-delay: 0.15s; animation-duration: 1.2s; }
.equalizer.playing .bar:nth-child(3)  { animation-delay: 0.05s; animation-duration: 0.75s; }
.equalizer.playing .bar:nth-child(4)  { animation-delay: 0.25s; animation-duration: 1.05s; }
.equalizer.playing .bar:nth-child(5)  { animation-delay: 0.10s; animation-duration: 0.85s; }
.equalizer.playing .bar:nth-child(6)  { animation-delay: 0.20s; animation-duration: 1.15s; }
.equalizer.playing .bar:nth-child(7)  { animation-delay: 0.00s; animation-duration: 0.95s; }
.equalizer.playing .bar:nth-child(8)  { animation-delay: 0.15s; animation-duration: 1.25s; }
.equalizer.playing .bar:nth-child(9)  { animation-delay: 0.05s; animation-duration: 0.8s; }
.equalizer.playing .bar:nth-child(10) { animation-delay: 0.25s; animation-duration: 1.1s; }
@keyframes eq {
  0%, 100% { height: 20%; }
  50%      { height: 100%; }
}

/* ==== Progress ==== */
.progress-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
}
.time {
  font-size: 11px;
  color: var(--text-muted);
  min-width: 34px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.seek-wrap {
  position: relative;
  flex: 1;
  height: 20px;
  display: flex;
  align-items: center;
}
#seek {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.1);
  cursor: pointer;
  outline: none;
  background-image: linear-gradient(var(--blurple), var(--blurple));
  background-repeat: no-repeat;
  background-size: 0% 100%;
  transition: background-size 0.1s;
}
#seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: #fff;
  transition: width 0.15s, height 0.15s;
  box-shadow: 0 0 8px rgba(88,101,242,0.8);
}
.seek-wrap:hover #seek::-webkit-slider-thumb { width: 14px; height: 14px; }
#seek::-moz-range-thumb {
  width: 0; height: 0; border: none; border-radius: 50%; background: #fff;
  transition: width 0.15s, height 0.15s;
}
.seek-wrap:hover #seek::-moz-range-thumb { width: 14px; height: 14px; }

/* ==== Controls ==== */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 4px;
}
.controls button {
  border: none;
  cursor: pointer;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.icon-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-hover);
  font-size: 18px;
}
.icon-btn:hover {
  background: #45474e;
  transform: translateY(-2px) scale(1.05);
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active {
  background: var(--blurple);
  box-shadow: 0 0 16px rgba(88,101,242,0.6);
}

.main-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--blurple);
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
  position: relative;
  overflow: hidden;
}
.main-btn:hover {
  background: var(--blurple-hover);
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 10px 28px rgba(88, 101, 242, 0.7);
}
.main-btn:active { transform: scale(0.9); }

/* ==== Volume ==== */
.volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  justify-content: center;
}
#volume {
  width: 160px;
  height: 5px;
  border-radius: 3px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255,255,255,0.1);
  cursor: pointer;
  outline: none;
  background-image: linear-gradient(var(--blurple), var(--blurple));
  background-repeat: no-repeat;
  background-size: 100% 100%;
}
#volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff;
}
#volume::-moz-range-thumb {
  width: 12px; height: 12px; border: none; border-radius: 50%; background: #fff;
}

/* ==== Footer ==== */
footer {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: var(--text-muted);
  background: rgba(43, 45, 49, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 15;
}
.credit {
  color: var(--blurple);
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* ==== Bottom Sheet (Playlist) ==== */
.sheet-toggle {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 25;
  background: rgba(49, 51, 56, 0.9);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 24px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.sheet-toggle:hover {
  background: rgba(58, 60, 66, 0.95);
  transform: translateX(-50%) translateY(-2px);
}
.sheet-toggle .badge {
  background: var(--blurple);
  color: #fff;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 700;
}
.sheet-toggle .arrow {
  display: inline-block;
  transition: transform 0.3s;
}
.sheet-toggle.open .arrow { transform: rotate(180deg); }

.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 30;
}
.sheet-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 70vh;
  max-height: 70vh;
  background: rgba(30, 31, 34, 0.98);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 40;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sheet.open { transform: translateY(0); }

.sheet-handle {
  padding: 12px 0 8px;
  cursor: grab;
  display: flex;
  justify-content: center;
  touch-action: none;
}
.sheet-handle::before {
  content: '';
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.25);
}

.sheet-header {
  padding: 4px 24px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sheet-header h2 {
  font-size: 16px;
  font-weight: 700;
}
.sheet-header .count {
  font-size: 12px;
  color: var(--text-muted);
}

.sheet-playlist {
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 24px;
  list-style: none;
}
.sheet-playlist::-webkit-scrollbar { width: 6px; }
.sheet-playlist::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
}

.sheet-playlist li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
  animation: itemIn 0.3s ease both;
}
@keyframes itemIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.sheet-playlist li:hover { background: rgba(255,255,255,0.06); }
.sheet-playlist li.active {
  background: linear-gradient(135deg, rgba(88,101,242,0.25), rgba(180,75,242,0.15));
}
.sheet-playlist li:active { transform: scale(0.98); }

.item-cover {
  width: 44px; height: 44px;
  border-radius: 8px;
  object-fit: cover;
  background: #222;
  flex-shrink: 0;
}
.item-info { flex: 1; min-width: 0; }
.item-title {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-meta {
  font-size: 12px; color: var(--text-muted);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-actions { display: flex; align-items: center; gap: 4px; }
.item-delete {
  background: transparent; border: none; color: var(--text-muted);
  cursor: pointer; padding: 6px 10px; border-radius: 8px;
  font-size: 14px; opacity: 0.6; transition: all 0.15s;
}
.item-delete:hover {
  opacity: 1; color: #f23f43; background: rgba(242,63,67,0.1);
}

.item-eq {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
  width: 16px;
}
.item-eq .bar {
  width: 2px;
  background: var(--blurple);
  border-radius: 1px;
  animation: eqSmall 0.9s ease-in-out infinite;
}
.item-eq .bar:nth-child(1) { animation-delay: 0s; }
.item-eq .bar:nth-child(2) { animation-delay: 0.2s; }
.item-eq .bar:nth-child(3) { animation-delay: 0.1s; }
@keyframes eqSmall {
  0%, 100% { height: 30%; }
  50%      { height: 100%; }
}
.sheet-playlist li.active.playing .item-eq { display: flex; }
.sheet-playlist li.active.playing .item-duration { display: none; }

.item-duration {
  font-size: 12px; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* ==== Mobile ==== */
@media (max-width: 500px) {
  .player-card { padding: 20px 16px; border-radius: 24px; }
  .cover-wrap { width: 180px; height: 180px; }
  .main-btn { width: 58px; height: 58px; }
  .icon-btn { width: 44px; height: 44px; }
  main { padding: 12px; }
  .sheet-toggle { bottom: 55px; }
}
</style>
</head>
<body>

<div class="bg-anim"></div>
<div class="bg-overlay"></div>

<header>
  <h1>🎧 Nixify</h1>
  <label class="upload-btn">
    + Add track
    <input type="file" id="fileInput" accept="audio/*" hidden>
  </label>
</header>

<main>
  <div class="player-card">
    <div class="cover-wrap" id="coverWrap">
      <img id="cover" alt="cover">
    </div>

    <div class="track-info">
      <div id="trackTitle" class="title">No track loaded</div>
      <div id="trackArtist" class="artist">—</div>
    </div>

    <div class="equalizer" id="equalizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="progress-row">
      <span class="time" id="current">0:00</span>
      <div class="seek-wrap">
        <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
      </div>
      <span class="time" id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" class="icon-btn" title="Previous">⏮</button>
      <button id="playPause" class="main-btn" title="Play">▶</button>
      <button id="next" class="icon-btn" title="Next">⏭</button>
      <button id="repeatBtn" class="icon-btn" title="Repeat">🔁</button>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
</main>

<footer>
  <p>Created by <span class="credit">NIX</span></p>
</footer>

<button class="sheet-toggle" id="sheetToggle">
  <span class="arrow">▲</span>
  Playlist
  <span class="badge" id="trackCount">0</span>
</button>

<div class="sheet-backdrop" id="sheetBackdrop"></div>

<div class="sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-header">
    <h2>Your playlist</h2>
    <span class="count" id="sheetCount">0 tracks</span>
  </div>
  <ul class="sheet-playlist" id="playlist"></ul>
</div>

<script>
// ============= IndexedDB =============
const DB_NAME = 'nixify-db';
const STORE = 'tracks';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const store = t.objectStore(STORE);
    const result = fn(store);
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
  });
}
const addTrack = t => tx('readwrite', s => s.add(t));
const deleteTrack = id => tx('readwrite', s => s.delete(id));
const getAllTracks = () => new Promise((res, rej) => {
  const r = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});

// ============= State =============
const audio = new Audio();
let tracks = [];
let currentIndex = -1;
let isRepeat = false;
let currentURL = null;

// ============= DOM =============
const fileInput = document.getElementById('fileInput');
const playPauseBtn = document.getElementById('playPause');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const repeatBtn = document.getElementById('repeatBtn');
const seekEl = document.getElementById('seek');
const volumeEl = document.getElementById('volume');
const currentEl = document.getElementById('current');
const durationEl = document.getElementById('duration');
const trackTitleEl = document.getElementById('trackTitle');
const trackArtistEl = document.getElementById('trackArtist');
const coverEl = document.getElementById('cover');
const coverWrap = document.getElementById('coverWrap');
const equalizer = document.getElementById('equalizer');
const sheet = document.getElementById('sheet');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetToggle = document.getElementById('sheetToggle');
const sheetHandle = document.getElementById('sheetHandle');
const playlistEl = document.getElementById('playlist');
const trackCountEl = document.getElementById('trackCount');
const sheetCountEl = document.getElementById('sheetCount');

// ============= Utils =============
function fmt(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function readTags(file) {
  return new Promise(resolve => {
    if (!window.jsmediatags) return resolve({});
    window.jsmediatags.read(file, {
      onSuccess: tag => resolve(tag.tags || {}),
      onError: () => resolve({})
    });
  });
}
function getDuration(file) {
  return new Promise(resolve => {
    const a = document.createElement('audio');
    a.preload = 'metadata';
    a.src = URL.createObjectURL(file);
    a.onloadedmetadata = () => { URL.revokeObjectURL(a.src); resolve(a.duration || 0); };
    a.onerror = () => resolve(0);
  });
}

// ============= Color extraction =============
function extractColors(imgSrc) {
  return new Promise(resolve => {
    if (!imgSrc) return resolve(null);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        const size = 40;
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;

        // Simple bucket-based dominant colors
        const buckets = {};
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 128) continue;
          // skip near-black and near-white
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          if (max < 30 || min > 225) continue;
          const key = `${r>>5}-${g>>5}-${b>>5}`;
          if (!buckets[key]) buckets[key] = { r:0, g:0, b:0, n:0 };
          buckets[key].r += r; buckets[key].g += g; buckets[key].b += b;
          buckets[key].n++;
        }
        const sorted = Object.values(buckets).sort((a,b) => b.n - a.n);
        const top = sorted.slice(0, 3).map(c => ({
          r: Math.round(c.r/c.n),
          g: Math.round(c.g/c.n),
          b: Math.round(c.b/c.n)
        }));
        while (top.length < 3) top.push({ r: 88, g: 101, b: 242 });
        resolve(top);
      } catch (e) {
        resolve(null);
      }
    };
    img.onerror = () => resolve(null);
    img.src = imgSrc;
  });
}

function applyColors(colors) {
  if (!colors) return;
  const toHex = c => '#' + [c.r, c.g, c.b].map(x => x.toString(16).padStart(2,'0')).join('');
  // boost saturation a bit
  const boost = c => {
    const max = Math.max(c.r,c.g,c.b) || 1;
    const f = 200 / max;
    return {
      r: Math.min(255, Math.round(c.r * f)),
      g: Math.min(255, Math.round(c.g * f)),
      b: Math.min(255, Math.round(c.b * f))
    };
  };
  document.documentElement.style.setProperty('--dyn-1', toHex(boost(colors[0])));
  document.documentElement.style.setProperty('--dyn-2', toHex(boost(colors[1] || colors[0])));
  document.documentElement.style.setProperty('--dyn-3', toHex(colors[2] || colors[0]));
}

// ============= Playback =============
function loadCurrent() {
  if (currentIndex < 0 || !tracks[currentIndex]) return;
  const t = tracks[currentIndex];

  if (currentURL) URL.revokeObjectURL(currentURL);
  currentURL = URL.createObjectURL(t.blob);
  audio.src = currentURL;

  trackTitleEl.textContent = t.title || 'Unknown';
  trackArtistEl.textContent = t.artist || '—';

  if (t.cover) {
    coverEl.src = t.cover;
    coverWrap.classList.add('has-cover');
    extractColors(t.cover).then(applyColors);
  } else {
    coverEl.removeAttribute('src');
    coverWrap.classList.remove('has-cover');
    applyColors([{r:88,g:101,b:242},{r:180,g:75,b:242},{r:30,g:31,b:34}]);
  }
  renderPlaylist();
}

function play() {
  if (currentIndex === -1 && tracks.length) {
    currentIndex = 0;
    loadCurrent();
  }
  if (audio.src) audio.play();
}
function pause() { audio.pause(); }
function toggle() { audio.paused ? play() : pause(); }
function next() {
  if (!tracks.length) return;
  if (isRepeat) { audio.currentTime = 0; audio.play(); return; }
  currentIndex = (currentIndex + 1) % tracks.length;
  loadCurrent();
  audio.play();
}
function prev() {
  if (!tracks.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
  loadCurrent();
  audio.play();
}

// ============= Playlist render =============
function renderPlaylist() {
  trackCountEl.textContent = tracks.length;
  sheetCountEl.textContent = tracks.length + ' track' + (tracks.length === 1 ? '' : 's');

  playlistEl.innerHTML = '';
  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = (i === currentIndex ? 'active' : '') + (i === currentIndex && !audio.paused ? ' playing' : '');
    li.style.animationDelay = (i * 0.03) + 's';

    const coverHtml = t.cover
      ? `<img class="item-cover" src="${t.cover}" alt="">`
      : `<div class="item-cover" style="display:flex;align-items:center;justify-content:center;font-size:20px">🎵</div>`;

    li.innerHTML = `
      ${coverHtml}
      <div class="item-info">
        <div class="item-title">${escapeHtml(t.title || 'Unknown')}</div>
        <div class="item-meta">${escapeHtml(t.artist || '—')}</div>
      </div>
      <div class="item-actions">
        <div class="item-eq">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span class="item-duration">${fmt(t.duration || 0)}</span>
        <button class="item-delete" title="Delete">✕</button>
      </div>
    `;
    li.addEventListener('click', e => {
      if (e.target.closest('.item-delete')) return;
      currentIndex = i;
      loadCurrent();
      audio.play();
    });
    li.querySelector('.item-delete').addEventListener('click', async e => {
      e.stopPropagation();
      await deleteTrack(t.id);
      tracks = await getAllTracks();
      if (i === currentIndex) {
        audio.pause();
        currentIndex = -1;
        trackTitleEl.textContent = 'No track loaded';
        trackArtistEl.textContent = '—';
        coverEl.removeAttribute('src');
        coverWrap.classList.remove('has-cover');
      } else if (i < currentIndex) {
        currentIndex--;
      }
      renderPlaylist();
    });
    playlistEl.appendChild(li);
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ============= Events =============
playPauseBtn.addEventListener('click', toggle);
nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);
repeatBtn.addEventListener('click', () => {
  isRepeat = !isRepeat;
  repeatBtn.classList.toggle('active', isRepeat);
});

audio.addEventListener('play', () => {
  playPauseBtn.textContent = '⏸';
  equalizer.classList.add('playing');
  coverWrap.classList.add('playing');
  renderPlaylist();
});
audio.addEventListener('pause', () => {
  playPauseBtn.textContent = '▶';
  equalizer.classList.remove('playing');
  coverWrap.classList.remove('playing');
  renderPlaylist();
});
audio.addEventListener('ended', () => {
  if (isRepeat) { audio.currentTime = 0; audio.play(); }
  else next();
});
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    seekEl.value = pct;
    seekEl.style.backgroundSize = pct + '% 100%';
    currentEl.textContent = fmt(audio.currentTime);
  }
});
audio.addEventListener('loadedmetadata', () => {
  durationEl.textContent = fmt(audio.duration);
});

seekEl.addEventListener('input', () => {
  if (audio.duration) {
    audio.currentTime = (seekEl.value / 100) * audio.duration;
    seekEl.style.backgroundSize = seekEl.value + '% 100%';
  }
});
volumeEl.addEventListener('input', () => {
  audio.volume = volumeEl.value;
  volumeEl.style.backgroundSize = (volumeEl.value * 100) + '% 100%';
});
volumeEl.style.backgroundSize = '100% 100%';

// ============= Sheet =============
let sheetOpen = false;
function openSheet() {
  sheetOpen = true;
  sheet.classList.add('open');
  sheetBackdrop.classList.add('show');
  sheetToggle.classList.add('open');
}
function closeSheet() {
  sheetOpen = false;
  sheet.classList.remove('open');
  sheetBackdrop.classList.remove('show');
  sheetToggle.classList.remove('open');
}
sheetToggle.addEventListener('click', () => sheetOpen ? closeSheet() : openSheet());
sheetBackdrop.addEventListener('click', closeSheet);

// Swipe to close
let startY = 0, currentY = 0, dragging = false;
function onStart(y) {
  startY = y; currentY = y; dragging = true;
  sheet.style.transition = 'none';
}
function onMove(y) {
  if (!dragging) return;
  currentY = y;
  const delta = Math.max(0, currentY - startY);
  sheet.style.transform = `translateY(${delta}px)`;
}
function onEnd() {
  if (!dragging) return;
  dragging = false;
  sheet.style.transition = '';
  const delta = currentY - startY;
  if (delta > 100) closeSheet();
  else sheet.style.transform = '';
}
sheetHandle.addEventListener('touchstart', e => onStart(e.touches[0].clientY));
sheetHandle.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientY); });
sheetHandle.addEventListener('touchend', onEnd);
sheetHandle.addEventListener('mousedown', e => {
  onStart(e.clientY);
  const move = ev => onMove(ev.clientY);
  const up = () => {
    onEnd();
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});

// ============= Upload =============
fileInput.addEventListener('change', async e => {
  const files = [...e.target.files];
  if (!files.length) return;

  for (const file of files) {
    const tags = await readTags(file);
    const duration = await getDuration(file);

    let cover = '';
    if (tags.picture) {
      try {
        const blob = new Blob([new Uint8Array(tags.picture.data)], { type: tags.picture.format });
        cover = await blobToDataURL(blob);
      } catch (err) { cover = ''; }
    }

    const fallbackName = file.name.replace(/\.[^/.]+$/, '');
    await addTrack({
      title: tags.title || fallbackName,
      artist: tags.artist || 'Unknown artist',
      album: tags.album || '',
      duration,
      cover,
      blob: file,
      added: Date.now()
    });
  }

  tracks = await getAllTracks();
  currentIndex = tracks.length - 1;
  loadCurrent();
  audio.play();
  fileInput.value = '';
});

// ============= Init =============
(async () => {
  db = await openDB();
  tracks = await getAllTracks();
  renderPlaylist();

  if (tracks.length) {
    currentIndex = tracks.length - 1;
    loadCurrent();
  }
})();
</script>
